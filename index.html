<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drehorte in Europa – Filmkarte</title>
<meta name="description" content="Interaktive Satellitenkarte bekannter Filmdrehorte in Europa.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="filme.js"></script>
<script>
// ===============================================================
// EINSTELLUNGEN
// Trag hier deinen MapTiler-Key ein (kostenlos auf maptiler.com).
// Leer lassen = Esri-Satellitenbilder als Ersatz (gut zum Testen).
// ===============================================================
const MAPTILER_KEY = "";
</script>
<style>
:root{
  --paper:#E6ECEE; --ink:#1D2B3A; --muted:#5B6A78; --panel:#FFFFFF; --line:#C9D3D8; --red:#C8102E;
  --shadow:0 6px 24px rgba(29,43,58,.18);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#132029;--ink:#E8EEF1;--muted:#9AAAB6;--panel:#1A2934;--line:#2D404D;--shadow:0 6px 24px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--paper:#132029;--ink:#E8EEF1;--muted:#9AAAB6;--panel:#1A2934;--line:#2D404D;--shadow:0 6px 24px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 Karla,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:350px 1fr;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
header{padding:22px 22px 14px}
h1{font:700 30px/1.05 "Zilla Slab",Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:14px}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.search,.country{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;min-width:0}
.search:focus-visible,.country:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.films{list-style:none;margin:0;padding:4px 10px 16px;overflow-y:auto;flex:1}
.film{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;color:inherit;font:inherit;cursor:pointer}
.film:hover{background:var(--paper)}
.film[aria-pressed="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--c)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--c)}
.ft{font:500 17px/1.2 "Zilla Slab",Georgia,serif}
.fy,.cnt{color:var(--muted);font-size:13px}
.cnt{font-variant-numeric:tabular-nums;text-align:right}
.reset{margin:0 22px 18px;padding:10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font:500 14px Karla,sans-serif;cursor:pointer}
.reset:hover{background:var(--paper)}
.empty{padding:16px 12px;color:var(--muted)}
main{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:#2b3a44}

.pin-icon{background:none;border:0}
.pin-icon span{display:block;width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.55);transition:transform .12s}
.pin-icon:hover span,.pin-icon.active span{transform:scale(1.3)}
.cluster{background:none;border:0}
.cluster div{width:38px;height:38px;border-radius:50%;background:#fff;color:#1D2B3A;display:grid;place-items:center;font:700 14px Karla,sans-serif;box-shadow:0 0 0 4px rgba(255,255,255,.45),0 2px 8px rgba(0,0,0,.5)}
.leaflet-control-layers{border:0!important;border-radius:8px!important;box-shadow:var(--shadow)!important;font:500 14px Karla,sans-serif}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important}
.leaflet-bar a{width:38px!important;height:38px!important;line-height:38px!important;font-size:20px!important}
.leaflet-tooltip{font:500 13px Karla,sans-serif;border:0;box-shadow:var(--shadow)}

.card{position:absolute;left:16px;bottom:28px;width:min(380px,calc(100% - 32px));background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;border-top:5px solid var(--c);display:none;z-index:1000}
.card.open{display:block}
.card h2{font:700 22px/1.15 "Zilla Slab",Georgia,serif;margin:0 0 2px;padding-right:28px}
.card .film-line{color:var(--muted);margin:0 0 10px;font-size:14px}
.card p{margin:0 0 12px}
.card .links{display:flex;gap:16px;flex-wrap:wrap}
.card a{color:var(--ink);font-weight:700;text-underline-offset:3px}
.close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:6px}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr 45%}
  main{grid-row:1}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  header{padding:14px 16px 8px}
  h1{font-size:23px}
  .sub{display:none}
  .controls{margin-top:8px}
  .reset{margin:0 16px 10px}
  .card{bottom:16px}
  .leaflet-control-layers{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Drehorte in Europa</h1>
      <p class="sub">Wo bekannte Filme gedreht wurden – auf echten Satellitenbildern. Film wählen oder direkt auf der Karte stöbern.</p>
      <div class="controls">
        <input class="search" id="q" type="search" placeholder="Film oder Ort suchen" aria-label="Film oder Ort suchen">
        <select class="country" id="country" aria-label="Land filtern"><option value="">Alle Länder</option></select>
      </div>
    </header>
    <ul class="films" id="films"></ul>
    <button class="reset" id="reset">Alle Filme zeigen</button>
  </aside>
  <main>
    <div id="map" aria-label="Karte von Europa mit Filmdrehorten"></div>
    <div class="card" id="card" role="dialog" aria-live="polite">
      <button class="close" id="close" aria-label="Schließen">×</button>
      <h2 id="cTitle"></h2>
      <p class="film-line" id="cFilm"></p>
      <p id="cScene"></p>
      <div class="links">
        <a id="cZoom" href="#">Ganz nah heranzoomen</a>
        <a id="cLink" target="_blank" rel="noopener">In Google Maps öffnen</a>
      </div>
    </div>
  </main>
</div>
<script>
// ---------------------------------------------------------------
// Daten vorbereiten: IDs und Farben automatisch vergeben
// ---------------------------------------------------------------
const PALETTE = ["#E0263F","#3D7DC4","#F0A202","#22A06B","#8A63C9","#11B5CF","#E06C9F","#B87333","#7FB800","#FF6B35","#5C6BC0","#00897B","#C2185B","#9E9D24"];
FILMS.forEach((f,i) => {
  f.id = "f" + i;
  f.color = f.color || PALETTE[i % PALETTE.length];
  f.countries = [...new Set(f.places.map(p => p.country))];
});
const PINS = FILMS.flatMap(f => f.places.map(p => ({...p, film:f})));
const COUNTRIES = [...new Set(PINS.map(p => p.country))].sort((a,b) => a.localeCompare(b,"de"));

// ---------------------------------------------------------------
// Kartenebenen
// ---------------------------------------------------------------
let satellit, satellitMitNamen;
if (MAPTILER_KEY) {
  const mt = s => `https://api.maptiler.com/maps/${s}/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`;
  const mtOpts = {tileSize:512, zoomOffset:-1, maxZoom:20, crossOrigin:true,
    attribution:'<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">© MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap-Mitwirkende</a>'};
  satellit = L.tileLayer(mt("satellite"), mtOpts);
  satellitMitNamen = L.tileLayer(mt("hybrid"), mtOpts);
} else {
  const esriAttr = 'Bilder © Esri, Maxar, Earthstar Geographics und die GIS User Community';
  satellit = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:20, maxNativeZoom:18, attribution:esriAttr});
  const namen = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom:20, maxNativeZoom:18});
  satellitMitNamen = L.layerGroup([L.tileLayer(satellit._url, satellit.options), namen]);
}
const strasse = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19,
  attribution:'<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap-Mitwirkende</a>'});
// Österreich in sehr hoher Auflösung (optional zuschaltbar)
const basemapAT = L.tileLayer("https://mapsneu.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/{z}/{y}/{x}.jpeg", {
  maxZoom:20, maxNativeZoom:19, bounds:L.latLngBounds([46.35,8.78],[49.04,17.19]),
  attribution:'Österreich: <a href="https://basemap.at" target="_blank" rel="noopener">basemap.at</a>'});

const map = L.map("map", {zoomControl:false, minZoom:3, maxZoom:20, worldCopyJump:true, layers:[satellitMitNamen]});
L.control.zoom({position:"topright"}).addTo(map);
L.control.layers(
  {"Satellit mit Ortsnamen":satellitMitNamen, "Satellit":satellit, "Straßenkarte":strasse},
  {"Österreich in Höchstauflösung":basemapAT},
  {position:"topright", collapsed:false}
).addTo(map);
L.control.scale({imperial:false, position:"bottomright"}).addTo(map);

// ---------------------------------------------------------------
// Pins
// ---------------------------------------------------------------
const cluster = L.markerClusterGroup({
  showCoverageOnHover:false, maxClusterRadius:45, spiderfyOnMaxZoom:true,
  iconCreateFunction: c => L.divIcon({html:`<div>${c.getChildCount()}</div>`, className:"cluster", iconSize:[38,38]})
});
map.addLayer(cluster);
PINS.forEach(d => {
  d.marker = L.marker([d.lat, d.lon], {
    icon: L.divIcon({className:"pin-icon", html:`<span style="--c:${d.film.color}"></span>`, iconSize:[24,24], iconAnchor:[12,12]}),
    keyboard:true, title:`${d.name} – ${d.film.title}`
  }).bindTooltip(d.name, {direction:"top", offset:[0,-12]})
    .on("click", () => openCard(d));
});

let activeFilm = null, query = "", country = "", activePin = null;
const sel = document.getElementById("country");
COUNTRIES.forEach(c => sel.add(new Option(c, c)));

function pinMatches(d){
  const q = query.toLowerCase();
  return (!activeFilm || d.film.id === activeFilm) &&
         (!country || d.country === country) &&
         (!q || d.film.title.toLowerCase().includes(q) || d.name.toLowerCase().includes(q));
}
function fitTo(pins){
  if (!pins.length) return;
  map.flyToBounds(L.latLngBounds(pins.map(d => [d.lat, d.lon])), {padding:[60,60], maxZoom:16, duration:1.2});
}
function applyFilter(fly){
  const pins = PINS.filter(pinMatches);
  cluster.clearLayers();
  cluster.addLayers(pins.map(d => d.marker));
  if (fly) fitTo(pins);
}

// ---------------------------------------------------------------
// Filmliste
// ---------------------------------------------------------------
const list = document.getElementById("films");
function renderList(){
  const q = query.toLowerCase();
  const films = FILMS.filter(f =>
    (!country || f.countries.includes(country)) &&
    (!q || f.title.toLowerCase().includes(q) || f.places.some(p => p.name.toLowerCase().includes(q))));
  list.innerHTML = "";
  if (!films.length){ list.innerHTML = '<li class="empty">Kein Treffer. Versuch es mit einem Filmtitel, einer Stadt oder wähle „Alle Länder“.</li>'; return; }
  [...films].sort((a,b) => a.year - b.year).forEach(f => {
    const n = f.places.filter(p => !country || p.country === country).length;
    const li = document.createElement("li");
    li.innerHTML = `<button class="film" style="--c:${f.color}" aria-pressed="${activeFilm===f.id}"><span class="dot"></span><span><span class="ft">${f.title}</span><br><span class="fy">${f.year} · ${f.countries.join(", ")}</span></span><span class="cnt">${n} ${n===1?"Ort":"Orte"}</span></button>`;
    li.firstChild.onclick = () => selectFilm(activeFilm === f.id ? null : f.id);
    list.appendChild(li);
  });
}
function selectFilm(id){
  activeFilm = id; closeCard(); renderList();
  if (id) applyFilter(true);
  else { applyFilter(false); fitTo(PINS.filter(pinMatches)); }
}
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); renderList(); applyFilter(false); });
sel.addEventListener("change", e => { country = e.target.value; activeFilm = null; closeCard(); renderList(); applyFilter(true); });
document.getElementById("reset").onclick = () => {
  query = ""; country = ""; document.getElementById("q").value = ""; sel.value = ""; selectFilm(null);
};

// ---------------------------------------------------------------
// Infokarte
// ---------------------------------------------------------------
const card = document.getElementById("card");
function openCard(d){
  if (activePin) activePin.marker.getElement()?.classList.remove("active");
  activePin = d; d.marker.getElement()?.classList.add("active");
  card.style.setProperty("--c", d.film.color);
  document.getElementById("cTitle").textContent = d.name;
  document.getElementById("cFilm").textContent = `${d.film.title} (${d.film.year}) – ${d.country}`;
  document.getElementById("cScene").textContent = d.scene;
  document.getElementById("cLink").href = `https://www.google.com/maps/search/?api=1&query=${d.lat},${d.lon}`;
  card.classList.add("open");
}
function closeCard(){
  card.classList.remove("open");
  if (activePin) activePin.marker.getElement()?.classList.remove("active");
  activePin = null;
}
document.getElementById("cZoom").onclick = e => { e.preventDefault(); if (activePin) map.flyTo([activePin.lat, activePin.lon], 18, {duration:1.5}); };
document.getElementById("close").onclick = closeCard;
map.on("click", closeCard);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

// Start: ganz Europa mit allen Orten
map.fitBounds(L.latLngBounds(PINS.map(d => [d.lat, d.lon])), {padding:[40,40]});
renderList();
applyFilter(false);
</script>
</body>
</html>
